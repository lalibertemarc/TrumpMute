<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#1f2f5c"/>
      <stop offset="0.6" stop-color="#121a38"/>
      <stop offset="1" stop-color="#080c1c"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset="0.45" stop-color="#e5b94c"/>
      <stop offset="1" stop-color="#8f5f17"/>
    </linearGradient>
    <linearGradient id="parch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf1d6"/>
      <stop offset="1" stop-color="#d9c08a"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a5c"/>
      <stop offset="0.5" stop-color="#e8262a"/>
      <stop offset="1" stop-color="#8e0c12"/>
    </linearGradient>
    <radialGradient id="redglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff4a3a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ff4a3a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- faded chat lines in the background -->
  <g fill="#2b3c70" opacity="0.9">
    <rect x="30" y="300" width="120" height="12" rx="6"/><rect x="160" y="300" width="70" height="12" rx="6"/>
    <rect x="30" y="324" width="80" height="12" rx="6"/><rect x="120" y="324" width="110" height="12" rx="6"/>
    <rect x="30" y="348" width="150" height="12" rx="6"/>
    <rect x="30" y="372" width="60" height="12" rx="6"/><rect x="100" y="372" width="90" height="12" rx="6"/>
  </g>

  <!-- stars -->
  <g fill="#fff6d0" opacity="0.8">
    <circle cx="352" cy="40" r="2"/><circle cx="24" cy="30" r="1.6"/><circle cx="370" cy="220" r="1.5"/>
    <circle cx="200" cy="18" r="1.4"/><circle cx="18" cy="250" r="1.6"/>
  </g>

  <!-- the chat bubble -->
  <g transform="rotate(-6 190 150)">
    <path d="M44,58 H336 Q362,58 362,84 V196 Q362,222 336,222 H150 L96,268 L108,222 H44 Q18,222 18,196 V84 Q18,58 44,58 Z"
          fill="url(#parch)" stroke="url(#gold)" stroke-width="9" stroke-linejoin="round"/>
    <path d="M44,58 H336 Q362,58 362,84 V196 Q362,222 336,222 H150 L96,268 L108,222 H44 Q18,222 18,196 V84 Q18,58 44,58 Z"
          fill="none" stroke="#3a2306" stroke-width="3" stroke-linejoin="round"/>
    <text x="190" y="170" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="98"
          fill="#2a1a08" letter-spacing="2">TRUMP</text>
    <!-- red strike-through -->
    <rect x="34" y="122" width="312" height="26" rx="13" fill="#3a0606" transform="rotate(-8 190 135)"/>
    <rect x="40" y="126" width="300" height="18" rx="9" fill="url(#red)" transform="rotate(-8 190 135)"/>
  </g>

  <!-- mute badge -->
  <circle cx="306" cy="300" r="92" fill="url(#redglow)"/>
  <circle cx="306" cy="300" r="66" fill="url(#red)" stroke="#3a0606" stroke-width="6"/>
  <circle cx="306" cy="300" r="56" fill="none" stroke="#ffd0c0" stroke-width="3" opacity="0.5"/>
  <g fill="#fff6d0" stroke="#3a0606" stroke-width="4" stroke-linejoin="round">
    <path d="M262,284 H280 L304,262 V338 L280,316 H262 Z"/>
  </g>
  <g stroke="#fff6d0" stroke-width="9" stroke-linecap="round">
    <path d="M318,286 L346,314"/>
    <path d="M346,286 L318,314"/>
  </g>

  <!-- sparkles -->
  <g fill="#fff6d0">
    <path d="M372,120 l4,12 l12,4 l-12,4 l-4,12 l-4,-12 l-12,-4 l12,-4 z"/>
    <path d="M214,300 l3,9 l9,3 l-9,3 l-3,9 l-3,-9 l-9,-3 l9,-3 z"/>
    <path d="M60,26 l3,9 l9,3 l-9,3 l-3,9 l-3,-9 l-9,-3 l9,-3 z"/>
  </g>
</svg>
